name: Update upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Update pins
        id: bump
        run: |
          ./update.sh
          if git diff --quiet -- sources.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check flake and measure disk
        if: steps.bump.outputs.changed == 'true'
        run: |
          peak_file="$RUNNER_TEMP/peak-disk-kb"
          df -Pk . | awk 'NR == 2 {print $3}' > "$peak_file"
          (
            while sleep 30; do
              df -Pk . | awk -v file="$peak_file" 'NR == 2 {print $3}' | while read -r used; do
                peak=$(cat "$peak_file")
                if (( used > peak )); then echo "$used" > "$peak_file"; fi
              done
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true; wait "$sampler" 2>/dev/null || true; echo "Peak disk used: $(cat "$peak_file") kB"' EXIT
          nix flake check -L
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.bump.outputs.changed == 'true'
        with:
          name: sources-${{ github.run_id }}
          path: sources.json

  commit:
    needs: update
    if: needs.update.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sources-${{ github.run_id }}
          path: ${{ runner.temp }}/a
      - name: Validate and commit pins
        id: validate
        env:
          ARTIFACT: ${{ runner.temp }}/a/sources.json
        run: |
          jq -e '
            (keys == ["ffmpeg", "hash", "rev", "version"]) and
            (.ffmpeg | keys == ["hash", "rev"]) and
            (.version | type == "string" and test("^[0-9]+(\\.[0-9]+)*-[0-9]+$")) and
            (.rev | type == "string" and test("^[0-9a-f]{40}$")) and
            (.hash | type == "string" and test("^sha256-[A-Za-z0-9+/]{43}=$")) and
            (.ffmpeg.rev | type == "string" and test("^[0-9a-f]{40}$")) and
            (.ffmpeg.hash | type == "string" and test("^sha256-[A-Za-z0-9+/]{43}=$"))
          ' "$ARTIFACT"
          cp "$ARTIFACT" sources.json
          echo "rev=$(jq -r '.rev[:12]' sources.json)" >> "$GITHUB_OUTPUT"
      - name: Push updated pins
        env:
          REV: ${{ steps.validate.outputs.rev }}
        run: |
          git add sources.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: update omabroadcast to $REV"
          git push
